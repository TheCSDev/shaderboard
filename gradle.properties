# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.warning.mode=all

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Maven properties
maven.group = com.thecsdev

# Mod properties
mod.id          = shaderboard
mod.version     = 2.0.0
mod.name        = Shaderboard
mod.description = Exposes client-side scoreboard values to post-effect shaders via named bindings
mod.author      = TheCSDev
mod.license     = All rights reserved

mod.link.homepage   = https://thecsdev.com/fwd/shaderboard/
mod.link.support_me = https://thecsdev.com/fwd/support-me/
mod.link.sources    = https://thecsdev.com/fwd/shaderboard-sources/
mod.link.issues     = https://thecsdev.com/fwd/shaderboard-issues/
mod.link.curseforge = https://thecsdev.com/fwd/shaderboard-curseforge/
mod.link.modrinth   = https://thecsdev.com/fwd/shaderboard-modrinth/

# 'pack.mcmeta' properties
pack.format = 97.1

# Minecraft properties
minecraft.version = 26.3

# Third-party mod versions
modmenu.version = 21.0.0-beta.1

# Fabric properties
fabric.loader_version = 0.19.5
fabric.api_version    = 0.160.5+26.3

    # fabric.mod.json properties
    fabric.json.entrypoints.main    = com.thecsdev.shaderboard.fabric.ShaderboardFabric
    fabric.json.entrypoints.client  = com.thecsdev.shaderboard.fabric.ShaderboardFabric
    fabric.json.entrypoints.server  = com.thecsdev.shaderboard.fabric.ShaderboardFabric
    fabric.json.entrypoints.modmenu = com.thecsdev.shaderboard.fabric.client.ShaderboardModmenu

    fabric.json.depends.java         = >=25
    fabric.json.depends.minecraft    = >=26.3- <26.4
    fabric.json.depends.fabricloader = >=0.19.5
    fabric.json.depends.fabric-api   = *
    fabric.json.depends.tcdcommons   = >=5.7.0

# Neo-Forge properties
neoforge.version = 26.1.0.7-beta

    # neoforge.mods.toml properties
    net.toml.loaderVersion             = [4,)
    neo.toml.dependencies.neoforge     = [26.2.0.1-beta,)
    neo.toml.dependencies.minecraft    = [26.3-, 26.4)
    neo.toml.dependencies.tcdcommons   = [5.7.0,)
